<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI課題ダッシュボード</title>
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#1f7a5c">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  /* このページだけで使う追加スタイル */
  .priority-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .priority-high { background: var(--danger-tint); color: var(--danger); }
  .priority-medium { background: #fdf0dc; color: var(--accent-orange); }
  .priority-low { background: var(--primary-tint); color: var(--primary); }

  .status-badge {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .status-done { background: var(--primary-tint); color: var(--primary); border-color: transparent; }
  .status-in-progress { background: #e6eefb; color: var(--accent-blue); border-color: transparent; }

  .assignee-chip {
    font-size: 11px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .task-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 6px 0;
  }

  .task-desc {
    font-size: 13px;
    color: var(--text);
    margin: 4px 0 0;
    white-space: pre-wrap;
  }

  .task-result {
    font-size: 12.5px;
    color: var(--text-muted);
    background: var(--surface-alt);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
    white-space: pre-wrap;
  }

  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .filter-chip {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
  }
  .filter-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .refresh-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .refresh-row .meta { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark">🧭</span>
    <div>
      <h1>AI課題ダッシュボード</h1>
      <p class="tagline">司令塔エージェントが受け付けた課題を、担当・優先度・進み具合ごとに確認できます</p>
    </div>
  </div>
</header>

<main id="app" style="padding-bottom: 24px;">

  <div class="notice" id="setupNotice">
    <p>ここはSlack(または司令塔エージェントへのテスト送信)で登録された課題の一覧です。表示は自動更新されません。最新の状態を見るには「更新」を押してください。</p>
  </div>

  <div class="refresh-row">
    <button class="btn ghost" id="refreshBtn" style="width:auto;">🔄 更新</button>
    <span class="meta" id="lastUpdated">まだ取得していません</span>
  </div>

  <div class="filter-row" id="statusFilters"></div>

  <div id="taskListEmpty" class="empty-state hidden">今のところ課題はありません。</div>
  <div id="taskListError" class="notice hidden" style="border-color: var(--danger); background: var(--danger-tint);">
    <p id="taskListErrorText">取得に失敗しました。</p>
  </div>
  <div class="list" id="taskList"></div>

</main>

<script src="js/tasks.js"></script>
</body>
</html>
